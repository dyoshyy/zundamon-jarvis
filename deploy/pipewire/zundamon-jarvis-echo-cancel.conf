# ZundamonJarvis echo cancellation (PipeWire, WebRTC AEC).
# Everything played to zundamon_jarvis_aec_sink is removed from zundamon_jarvis_aec_source.
# Install with deploy/install-audio.sh (symlinks into ~/.config/pipewire/pipewire.conf.d/).
context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            monitor.mode = false
            aec.args = {
                webrtc.gain_control = false
                webrtc.extended_filter = true
                webrtc.noise_suppression = true
            }
            audio.channels = 1
            audio.position = [ MONO ]
            capture.props = {
                node.name = "zundamon_jarvis_aec_capture"
                node.passive = true
                # Optional: pin the microphone (list with `pactl list short sources`); without it the default source is used.
                # target.object = "alsa_input.usb-EXAMPLE_Webcam-00.analog-stereo"
            }
            source.props = {
                node.name = "zundamon_jarvis_aec_source"
                node.description = "ZundamonJarvis AEC Source"
            }
            sink.props = {
                node.name = "zundamon_jarvis_aec_sink"
                node.description = "ZundamonJarvis AEC"
                audio.channels = 2
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name = "zundamon_jarvis_aec_playback"
                node.passive = true
            }
        }
    }
]
