<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title data-t="page.title">ずんだもんジャーヴィスの設定</title>
<link rel="icon" href="/assets/icon.png">
<link rel="stylesheet" href="/assets/setup.css">
<script src="/assets/setup.js" defer></script>
</head>
<body>
<div class="app">
  <header class="top">
    <img class="logo" src="/assets/icon.png" alt="" width="40" height="40">
    <div class="brand">
      <h1 data-t="brand.name">ずんだもんジャーヴィス</h1>
      <p data-t="brand.sub">はじめの設定</p>
    </div>
    <div id="lang" class="lang" role="group" aria-label="表示の言語" data-t-aria-label="lang.aria" hidden>
      <button type="button" data-lang="ja" lang="ja" aria-pressed="false">日本語</button>
      <button type="button" data-lang="en" lang="en" aria-pressed="false">English</button>
    </div>
  </header>

  <nav class="rail" aria-label="設定の手順" data-t-aria-label="rail.aria">
    <ol id="steps"></ol>
    <div id="dl-mini" class="dl-mini" hidden></div>
  </nav>

  <main class="stage">
    <div id="offline" class="banner banner-warn" role="alert" hidden>
      設定のプログラムとつながりません。ターミナルで止まっていないか確かめてください。
      止まっていたら、もう一度 <code>zundamon-jarvis setup</code> を実行してください。
    </div>
    <section class="card" aria-live="polite">
      <div class="bubble-row">
        <img class="face" src="/assets/icon.png" alt="" width="56" height="56">
        <p id="bubble" class="bubble"></p>
      </div>
      <h2 id="step-title"></h2>
      <div id="step-body"></div>
    </section>
    <footer class="nav">
      <button id="back" class="btn btn-ghost" type="button">戻る</button>
      <span id="nav-hint" class="nav-hint"></span>
      <button id="next" class="btn btn-primary" type="button">次へ</button>
    </footer>
  </main>
</div>
<noscript><p class="noscript">この画面には JavaScript が必要です。 / This page needs JavaScript.</p></noscript>
</body>
</html>
